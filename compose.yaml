version: '3.8'

services:
  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"  # Port HTTP API
    volumes:
      # Persistent storage for vector data
      - qdrant_storage:/qdrant/storage

  # Streamlit application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"  # Port Streamlit UI
    volumes:
      # Mount local directory with PDF files
      - ./app/data:/app/app/data
      # Mount API key file (read-only)
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    environment:
      # Qdrant URL (service name in Docker network)
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      # Start app only when Qdrant is ready
      - qdrant

# Volume for Qdrant data
volumes:
  qdrant_storage:
